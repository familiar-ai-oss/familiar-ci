DESC="PHPUNIT_COMPACT_OUTPUT=1: PHPUnit 13 prints its compact one-line-per-test form"
COMMON=phpunit
PREPARE="composer phpunit/phpunit:^13.4"
STACK=phpunit
TEST_COMMAND="vendor/bin/phpunit"
PLANNED_TEST=tests/GreetingTest.php
PLACE="src/Greeter.php greet 9 12"
ENV_VARS="PHPUNIT_COMPACT_OUTPUT=1"
SHIMS="php=composer:2"
EXPECT_RED=sealed
EXPECT_GREEN=green
EXPECT_READER=phpunit:reporter
