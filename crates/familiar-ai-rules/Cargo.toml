[package]
name = "familiar-ai-rules"
description = "Pure rules: planning, criterion states, holds, hook decisions, terminal text. No IO, no clock, no git."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
familiar-ai-facts = { version = "0.1.1-prod", path = "../familiar-ai-facts" }
serde = { version = "1", features = ["derive"] }
# `preserve_order` as in the plan crate: a move's fields keep the order the
# model names them in. Pure Rust.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
