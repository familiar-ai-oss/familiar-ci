name: ci

# The referee from CONTRIBUTING.md, plus the install test.

on:
  push:
  pull_request:

jobs:
  referee:
    runs-on: ubuntu-latest
    env:
      # the fixtures run the real binary, and `familiar-ai setup` is its own
      # commit: git must know who the runner is (a hosted runner has no
      # identity, and git refuses to invent one there)
      GIT_AUTHOR_NAME: familiar-ai ci
      GIT_AUTHOR_EMAIL: ci@familiar-ai.invalid
      GIT_COMMITTER_NAME: familiar-ai ci
      GIT_COMMITTER_EMAIL: ci@familiar-ai.invalid
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: clippy, warnings are errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: no C in any dependency
        run: scripts/check-no-c.sh

      - name: the walks (the real binary through the real hook protocol)
        env:
          FAMILIAR_AI_JUDGE: "off"
          FAMILIAR_AI_INVESTIGATOR: "off"
        run: |
          sh plugin/tests/test-run.sh
          sh plugin/tests/test-agent.sh
          sh plugin/tests/test-ci.sh

  install-test:
    # install.sh checks the checksum with sha256sum on Linux and shasum on
    # macOS: the matrix runs both paths
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install.sh refuses every bad release and installs a good one
        run: bash action/test-install.sh
